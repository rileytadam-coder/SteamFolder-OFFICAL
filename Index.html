<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam Folder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#121a24;
    color:white;
}

header{
    background:#171d25;
    text-align:center;
    padding:20px;
    border-bottom:3px solid #66c0f4;
}

header h1{
    color:#66c0f4;
}

.search-bar{
    display:flex;
    justify-content:center;
    padding:20px;
}

.search-bar input{
    width:400px;
    max-width:90%;
    padding:12px;
    border:none;
    border-radius:6px;
    font-size:16px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1b2838;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 15px rgba(102,192,244,.5);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:5px;
}

.card p{
    color:#66c0f4;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:700px;
    background:#1b2838;
    border-radius:10px;
    overflow:hidden;
}

.modal-content img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.modal-text{
    padding:20px;
}

.close{
    float:right;
    font-size:26px;
    cursor:pointer;
    color:#ff6666;
}

.link-btn{
    display:inline-block;
    margin-top:15px;
    background:#66c0f4;
    color:black;
    text-decoration:none;
    padding:10px 15px;
    border-radius:5px;
    font-weight:bold;
}

.link-btn:hover{
    background:#8fd7ff;
}
</style>
</head>
<body>

<header>
    <h1>🎮 Steam Folder</h1>
    <p>Your Favourite Driving & Simulation Games</p>
</header>

<div class="search-bar">
    <input
        type="text"
        id="search"
        placeholder="Search games..."
        onkeyup="searchGames()">
</div>

<div class="games" id="games"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <img id="modalImage">

        <div class="modal-text">

            <span class="close" onclick="closeModal()">✖</span>

            <h2 id="modalTitle"></h2>

            <br>

            <p><strong>Category:</strong> <span id="modalCategory"></span></p>

            <br>

            <p id="modalDescription"></p>

            <a
                id="modalLink"
                class="link-btn"
                target="_blank">
                Visit Game Page
            </a>

        </div>
    </div>
</div>

<script>

const games = [
{
    name: "American Truck Simulator",
    category: "Simulation",
    image: "https://cdn.cloudflare.steamstatic.com/steam/apps/270880/header.jpg",
    description: "Drive licensed trucks and deliver cargo across the United States.",
    link: "https://store.steampowered.com/app/270880/American_Truck_Simulator/"
},
{
    name: "Assetto Corsa",
    category: "Racing",
    image: "https://cdn.cloudflare.steamstatic.com/steam/apps/244210/header.jpg",
    description: "Realistic racing simulator with huge mod support.",
    link: "https://store.steampowered.com/app/244210/Assetto_Corsa/"
},
{
    name: "BeamNG.drive",
    category: "Driving",
    image: "https://cdn.cloudflare.steamstatic.com/steam/apps/284160/header.jpg",
    description: "Advanced soft-body physics vehicle simulator.",
    link: "https://store.steampowered.com/app/284160/BeamNGdrive/"
},
{
    name: "Mon Bazou",
    category: "Simulation",
    image: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1520370/header.jpg",
    description: "Build, tune and race vehicles while living in rural Quebec.",
    link: "https://store.steampowered.com/app/1520370/Mon_Bazou/"
},
{
    name: "Motor Town: Behind The Wheel",
    category: "Driving",
    image: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1369670/header.jpg",
    description: "Open-world driving game with multiplayer and jobs.",
    link: "https://store.steampowered.com/app/1369670/Motor_Town_Behind_The_Wheel/"
},
{
    name: "Over The Hill",
    category: "Off-Road",
    image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70",
    description: "Conquer rugged terrain and explore challenging off-road routes.",
    link: "https://store.steampowered.com/"
}
];

function displayGames(gameList){

    const container = document.getElementById("games");

    container.innerHTML = "";

    gameList.forEach(game => {

        container.innerHTML += `
        <div class="card" onclick="showGame('${game.name}')">

            <img src="${game.image}" alt="${game.name}">

            <div class="card-content">
                <h3>${game.name}</h3>
                <p>${game.category}</p>
            </div>

        </div>
        `;

    });

}

function searchGames(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered = games.filter(game =>
        game.name.toLowerCase().includes(search)
    );

    displayGames(filtered);

}

function showGame(name){

    const game = games.find(g => g.name === name);

    document.getElementById("modalTitle").textContent = game.name;
    document.getElementById("modalCategory").textContent = game.category;
    document.getElementById("modalDescription").textContent = game.description;
    document.getElementById("modalImage").src = game.image;
    document.getElementById("modalLink").href = game.link;

    document.getElementById("modal").style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

window.onclick = function(event){

    const modal = document.getElementById("modal");

    if(event.target === modal){
        closeModal();
    }
}

displayGames(games);

</script>

</body>
</html>
